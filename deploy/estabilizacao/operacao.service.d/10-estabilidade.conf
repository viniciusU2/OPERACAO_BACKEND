# /etc/systemd/system/operacao.service.d/10-estabilidade.conf
#
# Instalar com:
#   sudo mkdir -p /etc/systemd/system/operacao.service.d
#   sudo cp 10-estabilidade.conf /etc/systemd/system/operacao.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart operacao.service

[Service]
# Sobe de novo em qualquer saída (inclusive OOM kill), sem depender de
# alguém perceber que a API caiu.
Restart=always
RestartSec=3

# Dá tempo de encerrar requests longos (revisão com 182 fotos, Word) em vez
# de cortá-los no meio a cada restart.
TimeoutStopSec=60
TimeoutStartSec=120

# Evita falha de accept() por esgotamento de descritores sob concorrência.
LimitNOFILE=65535

# Log sem buffer: a linha exata da falha aparece no journalctl na hora.
Environment=PYTHONUNBUFFERED=1
