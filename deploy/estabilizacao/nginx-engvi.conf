server {
    server_name engvi.com.br;

    # ── Backend ──────────────────────────────────────────────────────────────
    # /api/login -> http://127.0.0.1:8001/login
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # O default do nginx é 1 MB: qualquer ZIP de relatório acima disso
        # era cortado aqui com 413, antes de chegar no FastAPI (limite real
        # do app: 100 MB).
        client_max_body_size 120m;
        client_body_timeout  300s;

        # O app lê o corpo em memória; não duplicar o upload em disco no nginx.
        proxy_request_buffering off;

        # /revisao devolve ~20 MB de JSON com as fotos em base64.
        # Sem isto o nginx acumula outra cópia inteira antes de repassar.
        proxy_buffering off;

        # Gerar as 182 miniaturas pode passar dos 60 s anteriores.
        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # ── Frontend ─────────────────────────────────────────────────────────────
    location / {
        root /var/www/engvi;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot

    ssl_certificate /etc/letsencrypt/live/engvi.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/engvi.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = engvi.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name engvi.com.br;
    return 404; # managed by Certbot
}
