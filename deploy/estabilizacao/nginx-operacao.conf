# ─────────────────────────────────────────────────────────────────────────────
# API FastAPI — Operação / Manutenção
#
# Inclua este bloco DENTRO do server { } que já atende o domínio da API,
# substituindo o location que hoje faz proxy para 127.0.0.1:8001.
# Ajuste apenas a porta caso o uvicorn esteja em outra.
#
# Testar antes de recarregar:  nginx -t
# ─────────────────────────────────────────────────────────────────────────────

location / {
    proxy_pass http://127.0.0.1:8001;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Upload de relatório: ZIP de até 100 MB no app + campos do formulário.
    # O default do nginx é 1 MB e devolve 413 antes de chegar no backend.
    client_max_body_size 120m;
    client_body_timeout  300s;

    # Não gravar o upload em disco no nginx: o app já lê o corpo em memória
    # (arquivo.read(MAX_ZIP_BYTES + 1)); o buffering só duplicaria I/O.
    proxy_request_buffering off;

    # A revisão devolve ~20 MB de JSON com as fotos em base64. Com buffering
    # ligado o nginx acumula outra cópia inteira antes de repassar; desligado
    # ele transmite conforme o app produz.
    proxy_buffering off;

    # A geração das 182 miniaturas pode passar dos 60 s do default.
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Repassa os erros do app (400/404/413/500) como estão.
    proxy_intercept_errors off;
}

# Opcional: reduz ~25% do JSON de base64 (ao comprimir, os dados de JPEG
# voltam a ficar próximos do tamanho original). Não resolve a memória do
# app, apenas o tráfego. Descomente se a banda for o gargalo.
#
# gzip on;
# gzip_types application/json;
# gzip_min_length 1024;
